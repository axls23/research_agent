name: prisma_2020
description: "PRISMA 2020 Systematic Review — full validation gates"

required_steps:
  - dark_data_ingestion
  - data_processing
  - rosetta_core
  - knowledge_graph
  - analysis
  - writing
  - audit_formatting

reasoning_guide:
  default_checklist: prisma_2020
  apply_per_paper: true
  checklist_items:
    - "Objective and research question (PICO where available)"
    - "Eligibility and methodology details"
    - "Information sources and retrieval context"
    - "Risk-of-bias and effect-measure reporting"
    - "Results with certainty and study flow"
    - "Limitations and practical implications"
    - "Transparency: funding and data availability"
    - "Core principle abstraction and hyperedge linkage"

validation:
  search_coverage:
    min_databases: 3
    require_search_log: true
    require_date_range: true
    min_papers_found: 10

  extraction:
    min_extraction_rate: 0.8
    min_quality_score: 0.6
    require_dual_extraction: false

  analysis:
    require_methods:
      - descriptive

reporting:
  prisma_flow_diagram: true
  methods_section: true
  audit_export: true
  prisma_checklist: true
